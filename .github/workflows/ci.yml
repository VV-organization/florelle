name: Production checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - run: npm run typecheck
      - name: Build deploy image
        run: docker build -t florelle:ci .
      - name: Exercise production image
        run: |
          docker run -d --name florelle -p 5195:3000 -e APP_ORIGIN=http://127.0.0.1:5195 florelle:ci
          trap 'docker logs florelle; docker rm -f florelle' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5195/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5195/api/health
          curl -fsS http://127.0.0.1:5195/b2c > /dev/null
          for font in prata manrope-variable passions-conflict-rus; do
            curl -fsS "http://127.0.0.1:5195/fonts/$font.woff2" > /dev/null
          done
          TEST_BASE_URL=http://127.0.0.1:5195 npm test
